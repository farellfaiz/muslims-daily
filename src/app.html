<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FAF6F1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Pasang tema sebelum halaman digambar supaya tidak berkedip terang saat mode gelap.
			try {
				var m = JSON.parse(localStorage.getItem('md:theme') || '{}').mode;
				// bawaan terang; hanya 'system' yang mengikuti pengaturan device
				if (m !== 'system') document.documentElement.dataset.theme = m === 'dark' ? 'dark' : 'light';
			} catch (e) {}
			// Chrome bisa mengirim tawaran pasang sebelum aplikasi selesai dimuat; simpan dulu di sini.
			addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__installPrompt = e;
			});
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Muslims Daily" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
