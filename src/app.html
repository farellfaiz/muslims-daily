<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FAF6F1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Pasang tema sebelum halaman digambar supaya tidak berkedip terang saat mode gelap.
			try {
				var m = JSON.parse(localStorage.getItem('md:theme') || '{}').mode;
				if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
			} catch (e) {}
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Muslims Daily" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
