<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#D3E4F3" />
		<script>
			// Dipasang sebelum halaman digambar: tema pilihan (bawaan terang, sama dengan aplikasinya)
			// dan mode animasi gulir. Pengguna yang memilih kurangi gerakan, atau tanpa JavaScript,
			// mendapat tata letak biasa tanpa adegan gulir.
			(function () {
				var d = document.documentElement;
				try {
					if (localStorage.getItem('mdl:theme') === 'dark') d.dataset.theme = 'dark';
				} catch (e) {}
				if (window.matchMedia && matchMedia('(prefers-reduced-motion: no-preference)').matches) d.classList.add('motion');
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
